plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${mc_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

loom {
    runs {
        configureEach {
            ideConfigGenerated(true)
        }
        client {
            client()
            setConfigName('Fabric Client')
            runDir("runs/client-${mc_version}")
        }
        server {
            server()
            setConfigName('Fabric Server')
            runDir("runs/${findProperty('run') ?: 'server'}-${mc_version}")
        }
    }
}


// A second client with the mod that goes straight to a server on localhost (start one with runServer): shows the
// live season updates players with Seasonfall installed get
loom {
    runs {
        moddedClient {
            client()
            setConfigName('Fabric Client (joins localhost)')
            runDir("runs/modded-client-${mc_version}")
            programArgs('--quickPlayMultiplayer', 'localhost:25565', '--username', 'Modded')
        }
    }
}
