plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev.legacyforge'
}

// Plain Minecraft (no loader) so nothing loader-specific can creep into the shared code
legacyForge {
    mcpVersion = mcp_version
    // The unit tests use the game's own libraries (Gson, SLF4J) too
    addModdingDependenciesTo(sourceSets.test)
}

dependencies {
    compileOnly "org.spongepowered:mixin:${mixin_version}"
    compileOnly "io.github.llamalad7:mixinextras-common:${mixinextras_version}"
    annotationProcessor "io.github.llamalad7:mixinextras-common:${mixinextras_version}"
}

repositories {
    maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public'
        content { includeGroupAndSubgroups('org.spongepowered') }
    }
}

// Unit tests for the parts that do not need a running game (calendar, history, growth maths, config checks, saving)
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}
