plugins {
    id 'java-library'
}

version = "${mod_version}+${mc_version}"
group = project.group

base {
    archivesName = "${mod_id}-${project.name.toLowerCase()}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

repositories {
    mavenCentral()
}

dependencies {
    // 26.x ships JSpecify with the game; 1.21.1 does not, and the annotations are only needed to compile
    compileOnly "org.jspecify:jspecify:${jspecify_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_id}" }
    }
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : '1',
                'Implementation-Title'  : mod_name,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : mc_version
        ])
    }
}

processResources {
    // The version ranges are spelled out in versions/<mc>.properties
    def expandProps = [
            version               : project.version.toString(),
            mod_id                : mod_id,
            mod_name              : mod_name,
            mod_author            : mod_author,
            mod_description       : mod_description,
            license               : license,
            mc_version            : mc_version,
            fabric_minecraft_range: fabric_minecraft_range,
            neoforge_range        : neoforge_range,
            minecraft_range       : minecraft_range,
            forge_range           : forge_range,
            pack_format           : pack_format,
            fabric_loader_version : fabric_loader_version,
            fabric_api_version    : fabric_api_version,
            java_version          : java_version
    ]
    inputs.properties(expandProps)
    filesMatching(['META-INF/neoforge.mods.toml', 'META-INF/mods.toml', 'fabric.mod.json', 'pack.mcmeta']) {
        expand expandProps
    }
}
