pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'seasonfall'
include('Common', 'Fabric', 'NeoForge', 'Forge')

// This branch builds Minecraft 1.20.1 (26.x is on main, 1.21.1 on mc1.21.1). Everything version-specific lives in
// versions/<mc>.properties.
def mc = providers.gradleProperty('mc').getOrElse('1.20.1')
def versionFile = file("versions/${mc}.properties")
if (!versionFile.isFile()) {
    throw new GradleException("Unsupported Minecraft version '${mc}': ${versionFile} does not exist")
}
def versionProps = new Properties()
versionFile.withInputStream { versionProps.load(it) }
gradle.beforeProject { project ->
    versionProps.each { key, value -> project.ext.set(key as String, value) }
}
