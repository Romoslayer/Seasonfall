plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev.legacyforge'
}

// NeoForge 47.1 is still a Forge fork on 1.20.1 (same packages, same mods.toml), so this builds the Forge project's
// entrypoint and metadata against NeoForge instead of Forge
def forge = project(':Forge')
sourceSets.main {
    java.srcDir forge.file('src/main/java')
    resources.srcDir forge.file('src/main/resources')
}

legacyForge {
    enable {
        neoForgeVersion = neoforge_version
    }

    runs {
        client {
            client()
            gameDirectory = file("runs/client-${mc_version}")
        }
        server {
            server()
            gameDirectory = file("runs/${findProperty('run') ?: 'server'}-${mc_version}")
            programArgument '--nogui'
        }
        // A second client with the mod that goes straight to a server on localhost (-Pserver=host:port for another):
        // shows the live season updates
        moddedClient {
            client()
            gameDirectory = file("runs/modded-client-${mc_version}")
            programArguments.addAll('--quickPlayMultiplayer', findProperty('server') ?: 'localhost:25565', '--username', 'Modded')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

apply from: rootProject.file('gradle/legacy-forge-mixins.gradle')
